# Backup diário do banco (pg_dump) publicado como artifact do GitHub Actions.
#
# Requisitos: o secret DATABASE_URL precisa estar cadastrado no repositório
# (Settings → Secrets and variables → Actions).
#
# O artifact é o MÍNIMO da Fase 0 — migrar para R2/repo privado conforme README.
# Teste de RESTORE real (restaurar o dump em um banco vazio) é critério de
# pronto da Fase 1: backup que nunca foi restaurado não é backup.
name: Backup

on:
  schedule:
    - cron: "0 3 * * *" # diário às 03:00 UTC (00:00 em America/Sao_Paulo)
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      # O pg_dump que vem no runner está uma major ATRASADO (16.x) e se RECUSA
      # a falar com servidor mais novo ("aborting because of server version
      # mismatch") — foi o que deixou este backup vermelho sem ninguém notar.
      # Instalamos o cliente do repositório oficial PGDG, sem fixar a major:
      # cliente mais NOVO que o servidor é caso suportado pelo PostgreSQL,
      # então quando o Supabase subir de 17 para 18 o job segue funcionando.
      #
      # PEGADINHA: instalar não basta. O /usr/bin/pg_dump do Ubuntu é um
      # wrapper (pg_wrapper) que escolhe a versão pelo CLUSTER local, e o
      # runner tem um PostgreSQL 16 instalado — ou seja, ele continuava
      # chamando o 16 mesmo com o 18 no disco. Por isso o PATH aponta direto
      # para o bin da major mais nova que existir.
      - name: Instalar postgresql-client mais recente (PGDG)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          PGBIN="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)"
          echo "$PGBIN" >> "$GITHUB_PATH"
          "$PGBIN/pg_dump" --version

      # O nome do arquivo é calculado UMA vez: antes, cada passo chamava
      # `date +%F` de novo e um job que virasse a meia-noite UTC procurava um
      # arquivo com a data de ontem.
      - name: Definir nome do arquivo
        run: echo "DUMP_FILE=trive-backup-$(date +%F).dump" >> "$GITHUB_ENV"

      - name: Gerar dump do banco
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "ERRO: secret DATABASE_URL não cadastrado no repositório." >&2
            exit 1
          fi
          pg_dump --version
          pg_dump "$DATABASE_URL" --no-owner --format=custom --file="$DUMP_FILE"
          ls -lh "$DUMP_FILE"

      - name: Verificar que o dump é legível e tem o que importa
        # Dump ilegível OU vazio de conteúdo = job vermelho. `pg_restore --list`
        # falha em arquivo corrompido; o grep garante que as tabelas do negócio
        # realmente entraram (backup que existe mas não tem os pedidos dentro
        # é pior que backup nenhum, porque dá falsa segurança).
        run: |
          pg_restore --list "$DUMP_FILE" > /tmp/conteudo.txt
          for tabela in orders order_items products customers stock_movements; do
            grep -q "TABLE DATA public $tabela " /tmp/conteudo.txt \
              || { echo "ERRO: tabela $tabela ausente do dump." >&2; exit 1; }
          done
          echo "Dump legível com $(grep -c 'TABLE DATA' /tmp/conteudo.txt) tabelas."

      - name: Publicar artifact
        uses: actions/upload-artifact@v4
        with:
          name: trive-backup
          path: trive-backup-*.dump
          retention-days: 30
          if-no-files-found: error
